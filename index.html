<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nays Laundry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [v-cloak] { display: none !important; }
    </style>
  <!-- Detector Error untuk Tablet -->
<script>
    // Langsung munculkan Bar Status saat halaman dimuat
    document.addEventListener('DOMContentLoaded', function() {
        var b = document.createElement('div');
        b.id = 'status-bar';
        b.style = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#1e293b;color:white;padding:10px;font-size:11px;font-family:sans-serif;box-shadow:0 4px 6px rgba(0,0,0,0.3);';
        b.innerHTML = '<b>🔍 DETECTOR AKTIF:</b> Menunggu pemuatan Vue & app.js...';
        document.body.appendChild(b);
    });

    // Tangkap SEMUA jenis error JavaScript
    window.addEventListener('error', function(e) {
        var el = document.getElementById('status-bar');
        if (el) {
            el.style.background = '#dc2626';
            el.innerHTML = '<b>⚠️ ERROR JAVASCRIPT:</b><br>' + (e.message || (e.target && e.target.src) || e);
        }
    }, true);

    window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('status-bar');
        if (el) {
            el.style.background = '#dc2626';
            el.innerHTML = '<b>⚠️ REJECTION ERROR:</b><br>' + (e.reason && e.reason.message ? e.reason.message : e.reason);
        }
    });
</script>
</head>
<body class="bg-slate-50 text-slate-800 text-xs select-none">
    
    <div id="app" v-cloak></div>

    <!-- Load Vue 3 Global -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Entry Point Aplikasi Modular -->
    <script type="module" src="./app.js"></script>
</body>
</html>
