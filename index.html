<!DOCTYPE html>
<html lang="id">
<head>
  <script>
    fetch('./app.js').then(r => {
        if (!r.ok) throw new Error('HTTP Status ' + r.status + ' (' + r.statusText + ') - File app.js TIDAK DITEMUKAN di server GitHub!');
    }).catch(err => {
        var b = document.createElement('div');
        b.style = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:white;padding:12px;font-size:12px;font-family:sans-serif;word-break:break-all;';
        b.innerHTML = '<b>⚠️ DIAGNOSTIK PRESI:</b><br>' + err.message;
        document.body ? document.body.appendChild(b) : document.documentElement.appendChild(b);
    });
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nays Laundry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [v-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 text-xs select-none">
    
    <div id="app" v-cloak></div>

    <!-- Load Vue 3 Global -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Entry Point Aplikasi Modular -->
    <script type="module" src="./app.js"></script>
</body>
</html>
