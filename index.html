<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nays Laundry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
    body { font-family: 'Inter', sans-serif; }
    [v-cloak] { display: none !important; }
    
    /* Pengunci Halaman Cetak PDF Agar Tidak Ada Halaman 2 Blank */
    @media print {
        @page { size: auto; margin: 5mm; }
        html, body { height: 100%; margin: 0 !important; padding: 0 !important; overflow: hidden; }
        .print-page { page-break-inside: avoid !important; page-break-after: avoid !important; margin-bottom: 0 !important; }
    }
</style>
  <!-- Detector Error Silent (Hanya muncul jika ada error) -->
<script>
    window.addEventListener('error', function(e) {
        var b = document.getElementById('err-box') || document.createElement('div');
        b.id = 'err-box';
        b.style = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:white;padding:12px;font-size:11px;font-family:sans-serif;word-break:break-all;box-shadow:0 4px 6px rgba(0,0,0,0.3);';
        b.innerHTML = '<b>⚠️ ERROR JAVASCRIPT:</b><br>' + (e.message || (e.target && e.target.src) || e);
        document.body ? document.body.appendChild(b) : document.documentElement.appendChild(b);
    }, true);

    window.addEventListener('unhandledrejection', function(e) {
        var b = document.getElementById('err-box') || document.createElement('div');
        b.id = 'err-box';
        b.style = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:white;padding:12px;font-size:11px;font-family:sans-serif;word-break:break-all;box-shadow:0 4px 6px rgba(0,0,0,0.3);';
        b.innerHTML = '<b>⚠️ REJECTION ERROR:</b><br>' + (e.reason && e.reason.message ? e.reason.message : e.reason);
        document.body ? document.body.appendChild(b) : document.documentElement.appendChild(b);
    });
</script>
</head>
<body class="bg-slate-50 text-slate-800 text-xs select-none">
    
    <div id="app" v-cloak></div>

    <!-- Load Vue 3 Global -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.js"></script>
    <!-- Entry Point Aplikasi Modular -->
    <script type="module" src="./app.js"></script>
</body>
</html>
