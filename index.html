<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nays Laundry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [v-cloak] { display: none !important; }
    </style>
  <!-- Detector Error untuk Tablet -->
<script>
    window.addEventListener('error', function(e) {
        var box = document.getElementById('err-box') || document.createElement('div');
        box.id = 'err-box';
        box.style = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:white;padding:12px;font-size:12px;font-family:sans-serif;word-break:break-all;box-shadow:0 4px 6px rgba(0,0,0,0.3);';
        var src = e.target && (e.target.src || e.target.href);
        box.innerHTML = '<b>⚠️ DETECTOR ERROR:</b><br>' + (src ? 'Gagal memuat file: ' + src : e.message);
        document.body ? document.body.appendChild(box) : document.documentElement.appendChild(box);
    }, true);
</script>
</head>
<body class="bg-slate-50 text-slate-800 text-xs select-none">
    
    <div id="app" v-cloak></div>

    <!-- Load Vue 3 Global -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Entry Point Aplikasi Modular -->
    <script type="module" src="./app.js"></script>
</body>
</html>
